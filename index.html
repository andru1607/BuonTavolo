const state={role:'customer',tab:'home',welcome:!localStorage.getItem(WELCOME),search:'',selectedCustomer:'CL-10482',wizard:1,draft:{customer:'CL-10482',date:today(),confirmed:false,rating:0,tags:['Cortesia'],text:'',note:''}};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rand=(n=6)=>{let a=new Uint32Array(n);crypto.getRandomValues(a);let c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return [...a].map(x=>c[x%c.length]).join('')};
const customer=(id)=>db.customers.find(c=>c.id===id);
const reviews=(id)=>db.reviews.filter(r=>r.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));
const valid=(r)=>r.status==='pubblicata';
const positive=(r)=>valid(r)&&r.rating>=POSITIVE_MIN;
const stats=(id)=>{const rr=reviews(id).filter(valid),p=rr.filter(positive);return {count:rr.length,positive:p.length,average:rr.length?(rr.reduce((s,r)=>s+r.rating,0)/rr.length).toFixed(1):'—',progress:p.length%10}};
const ratingText=(n)=>n>=9?'Ottima':n>=8?'Buona':n>=6?'Nella media':'Da migliorare';
function reconcileVouchers(id){const earned=Math.floor(stats(id).positive/10);let all=db.vouchers.filter(v=>v.customerId===id);all.forEach((v,i)=>{if(v.status==='riscattato')return;v.status=i<earned?'disponibile':'sospeso'})}
const title=(eyebrow,t,desc='')=>`<div class="page-title"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(t)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div>`;
const nav=()=>state.role==='customer'?[['home','Home','home'],['reviews','Recensioni','reviews'],['rewards','Premi','gift'],['profile','Profilo','user']]:[['home','Home','home'],['clients','Clienti','users'],['review','Recensisci','pen'],['manage','Gestione','settings']];
const changeTab=(tab)=>{state.tab=tab;render();scrollToTop()};const scrollToTop=()=>window.scrollTo({top:0,behavior:'instant'});
const footer=()=>`<div class="banner">${icon('info',14)} <strong>Anteprima dimostrativa.</strong> Recensioni, visite, note e buoni sono simulati e salvati solo nel browser. Non inserire dati reali: non è presente autenticazione o protezione server.</div>`;
function header(){const entries=nav();return `<div class="frame"><aside class="sidebar"><div class="side-brand"><span class="brand-symbol">${icon('logo',31)}</span><div><span class="brand-word">BuonTavolo</span><span class="brand-sub">Reputazione e premi</span></div></div><div class="side-role">${state.role==='customer'?'Il tuo spazio':'Area ristoratore'}</div><nav class="side-nav" aria-label="Menu principale">${entries.map(([k,label,ic])=>`<button type="button" data-tab="${k}" class="${state.tab===k?'active':''}">${icon(ic)}${label}</button>`).join('')}</nav><div class="side-bottom"><button type="button" data-action="switch-role">${icon('logout',16)} Cambia modalità</button><small>Versione demo • Nessun dato reale<br>Nessuna recensione reale.</small></div></aside><main class="main"><div class="inner"><header class="masthead"><div class="mast-name"><span class="brand-symbol">${icon('logo',27)}</span>BuonTavolo</div><div class="mast-right"><span class="demo-label">DEMO</span><button type="button" class="role-button" data-action="switch-role">${state.role==='customer'?'Vista cliente':'Vista ristoratore'} ${icon('arrow',12)}</button></div></header>${body()}${footer()}</div></main></div><nav class="mobile-bottom" aria-label="Navigazione mobile">${entries.map(([k,label,ic])=>`<button type="button" data-tab="${k}" aria-label="${label}" ${state.tab===k?'aria-current="page"':''} class="${state.tab===k?'active':''}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav>${state.welcome?welcome():''}`}
function welcome(){return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="w-title"><div class="welcome"><div style="color:var(--olive)">${icon('logo',35)}</div><div class="eyebrow" style="margin-top:10px">Benvenuto nella demo</div><h1 id="w-title">L'ospitalità, vista dall'altro lato.</h1><p>Una piattaforma dove i ristoratori valutano le visite e i clienti seguono la propria reputazione e i premi. Da dove vuoi iniziare?</p><button class="role-choice" data-action="start" data-role="customer">${icon('user',28)}<span class="grow"><strong>Sono un cliente</strong><small>Scopri la tessera, le recensioni e i premi</small></span>${icon('arrow',18)}</button><button class="role-choice" data-action="start" data-role="restaurant">${icon('users',28)}<span class="grow"><strong>Sono un ristoratore</strong><small>Cerca un cliente e compila una recensione</small></span>${icon('arrow',18)}</button><div class="quiet" style="text-align:center;margin-top:17px">Solo dati fittizi. Nessuna registrazione necessaria.</div></div></div>`}
function body(){if(state.role==='customer')return ({home:clientHome,reviews:clientReviews,rewards:clientRewards,profile:clientProfile}[state.tab]||clientHome)();return ({home:merchantHome,clients:merchantClients,review:merchantReview,manage:merchantManage}[state.tab]||merchantHome)()}
function starLine(n){return `<span class="stars" aria-label="${n} stelle su 10">${'★'.repeat(Math.round(n))}${'☆'.repeat(Math.max(0,MAX_STARS-Math.round(n)))}</span>`}
function reviewItem(r,canDispute=false){return `<article class="review-item"><div class="review-restaurant"><div class="restaurant-seal">${icon('logo',23)}</div><div class="grow"><h3>${esc(r.restaurant)}</h3><div class="review-meta">${fmt(r.date)} · Valutazione della visita</div></div><span class="pill ${r.status==='contestata'?'warn':'gold'}">${r.status==='contestata'?'Contestata':`${r.rating}/${MAX_STARS}`}</span></div><p class="review-text">“${esc(r.text)}”</p><div class="review-footer"><span>${starLine(r.rating)}</span>${canDispute&&r.status==='pubblicata'?`<button data-action="dispute" data-id="${esc(r.id)}">Contesta</button>`:r.status==='contestata'?'<span class="quiet">In revisione</span>':''}</div></article>`}
function clientHome(){const c=customer(db.activeCustomer),s=stats(c.id),latest=reviews(c.id).slice(0,2);return `${title('Area cliente','Il tuo spazio','La tua reputazione, le tue esperienze e i premi conquistati.')}
<section class="hero-card"><div class="content"><div class="smallcaps" style="color:#ceb891">Tessera personale</div><h2>${esc(c.nickname)}</h2><div class="member-id">ID Cliente ${esc(c.id.replace('CL-',''))}</div><button class="id-copy" data-action="copy-id">${icon('copy',13)} Copia ID</button><div class="sep"></div><div class="badge-line">${icon('award',26)}<strong>Reputazione ${s.count?ratingText(Number(s.average)).toLowerCase():"da costruire"}</strong></div><div class="subline">${s.count} ${s.count===1?'visita recensita':'visite recensite'}</div></div></section>
<section class="panel" style="margin-top:14px"><div class="reward-top"><h2>Verso il prossimo premio</h2><strong>${s.progress} / 10</strong></div><div class="dots">${Array.from({length:10},(_,i)=>`<span class="dot ${i<s.progress?'filled':''}"></span>`).join('')}<span class="gift-icon">${icon('gift',27)}</span></div><p class="reward-message">${10-s.progress} ${10-s.progress===1?'recensione positiva':'recensioni positive'} al prossimo buono. Sono positive solo le valutazioni da 8 a 10 stelle.</p><button class="text-action" data-tab="rewards" style="margin-top:10px">Come funzionano i premi ›</button></section>
<div class="section-heading"><h2>Le tue ultime recensioni</h2><button class="text-action" data-tab="reviews">Vedi tutte ›</button></div><div class="panel">${latest.length?latest.map(r=>reviewItem(r,false)).join(''):'<div class="empty">Nessuna recensione per questo profilo.</div>'}</div>`}
function clientReviews(){const rs=reviews(db.activeCustomer);return `${title('La tua storia','Le tue recensioni','Le valutazioni vanno da 1 a 10 stelle. Solo 8, 9 e 10 sono positive.')}<div class="panel"><div class="row between" style="margin-bottom:12px"><strong>${rs.length} recensioni</strong><span class="quiet">Le più recenti per prime</span></div>${rs.length?rs.map(r=>reviewItem(r,true)).join(''):'<div class="empty">Le tue recensioni appariranno qui dopo le visite.</div>'}</div><div class="info-alert">Puoi contestare una recensione. Nella versione reale la richiesta verrà esaminata da una persona prima di prendere decisioni definitive.</div>`}
function clientRewards(){const c=customer(db.activeCustomer),s=stats(c.id),vv=db.vouchers.filter(v=>v.customerId===c.id);return `${title('Vantaggi','I tuoi premi','Ogni 10 recensioni da 8 a 10 stelle, verificate, ricevi un buono da usare nei locali aderenti.')}
<div class="panel"><div class="reward-top"><h2>La tua raccolta</h2><strong>${s.progress} / 10</strong></div><div class="dots">${Array.from({length:10},(_,i)=>`<span class="dot ${i<s.progress?'filled':''}"></span>`).join('')}<span class="gift-icon">${icon('gift',27)}</span></div><p class="quiet">${10-s.progress} al prossimo premio. Solo le recensioni da 8 a 10 stelle sono positive.</p></div>
<div class="section-heading"><h2>Buoni disponibili</h2></div>${vv.filter(v=>v.status==='disponibile').length?vv.filter(v=>v.status==='disponibile').map(v=>`<div class="coupon"><div class="row between"><div class="smallcaps">Buono dimostrativo</div><span class="pill">Disponibile</span></div><h3 style="font-size:23px;margin:10px 0">Premio fedeltà</h3><div class="coupon-code">${esc(v.code)}</div><p class="quiet" style="margin-top:10px">Mostra questo codice a un ristorante aderente nella demo.</p><button class="button olive" style="margin-top:14px" data-action="copy-code" data-code="${esc(v.code)}">${icon('copy',16)} Copia codice</button></div>`).join(''):'<div class="empty"><strong>Il prossimo premio si avvicina</strong>Ancora qualche visita positiva e lo troverai qui.</div>'}
${vv.some(v=>v.status==='riscattato')?`<div class="section-heading"><h2>Premi utilizzati</h2></div><div class="panel">${vv.filter(v=>v.status==='riscattato').map(v=>`<div class="row between"><span class="quiet">${esc(v.code)}</span><span class="pill grey">Riscattato</span></div>`).join('')}</div>`:''}
${vv.some(v=>v.status==='sospeso')?`<div class="section-heading"><h2>Premi in verifica</h2></div><div class="panel quiet">Un buono dimostrativo è sospeso perché una recensione positiva è stata contestata. Sarà disponibile dopo una nuova recensione positiva valida o l'esito favorevole di una verifica.</div>`:''}<div class="info-alert">Percentuali di sconto, scadenze e locali aderenti saranno definiti prima del lancio. I buoni di questa demo non hanno valore economico.</div>`}
function clientProfile(){const c=customer(db.activeCustomer);return `${title('Impostazioni','Il tuo profilo','Personalizza il nickname e trova il tuo identificativo.')}<div class="panel stack"><div><div class="smallcaps muted">Il tuo ID cliente</div><h2 style="font-size:26px;margin:9px 0">${esc(c.id)}</h2><p class="quiet">Condividilo con il ristorante quando vuoi collegare una visita.</p></div><button class="button" data-action="copy-id">${icon('copy')} Copia il mio ID</button><div class="divider" style="margin:2px 0"></div><form id="nickname-form" class="stack"><div class="field"><label for="nickname">Il tuo nickname</label><input id="nickname" name="nickname" maxlength="24" minlength="3" required value="${esc(c.nickname)}" autocomplete="off"><small>Sarà visibile ai ristoratori autorizzati.</small></div><button class="button olive full" type="submit">Salva le modifiche</button></form></div><div class="section-heading"><h2>Prova un altro profilo</h2></div><div class="panel stack"><div class="field"><label for="demo-customer">Scegli un cliente di esempio</label><select id="demo-customer">${db.customers.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.nickname)} · ${esc(x.id)}</option>`).join('')}</select></div><div class="divider" style="margin:0"></div><form id="create-customer" class="stack"><div class="field"><label for="new-nick">Oppure crea un profilo dimostrativo</label><input id="new-nick" name="nickname" placeholder="Scegli un nickname" required minlength="3" maxlength="24" autocomplete="off"></div><button type="submit" class="button">${icon('user')} Crea profilo demo</button></form></div><div class="section-heading"><h2>Privacy e dati</h2></div><div class="panel stack"><p class="quiet">Nella versione reale potrai accedere ai dati che ti riguardano, fare richieste di rettifica o cancellazione nei casi previsti e contestare le recensioni.</p><button class="button" data-action="export">Esporta i miei dati demo</button></div>`}
function merchantHome(){const list=db.customers.filter(c=>reviews(c.id).length>0);return `${title('Area ristoratore','Benvenuto, Ristorante La Quercia','Consulta i profili e registra le esperienze dei clienti.')}
<div class="home-illustration"><div><h1>L'ospitalità lascia il segno.</h1><p>Esperienze reali, valutazioni responsabili.</p></div></div>
<div class="section-heading"><h2>Trova un cliente</h2></div><div class="search">${icon('search',21)}<input id="client-search" type="search" placeholder="Cerca per nickname o ID" aria-label="Cerca un cliente" value="${esc(state.search)}" autocomplete="off"></div><div id="quick-results" class="stack" style="margin-top:10px">${filteredClients().map(clientRow).join('')}</div>
<button class="button primary full" style="margin-top:16px" data-tab="review">${icon('pen')} Nuova recensione</button>
<div class="section-heading"><h2>In breve</h2></div><div class="cols"><div class="mini-stat"><span>Clienti nella demo</span><strong>${db.customers.length}</strong><span>profili di esempio</span></div><div class="mini-stat"><span>Recensioni totali</span><strong>${db.reviews.length}</strong><span>incluse le contestate</span></div></div><div class="section-heading"><h2>Ultimi clienti</h2><button class="text-action" data-tab="clients">Vedi tutti ›</button></div><div class="stack">${list.slice(0,3).map(clientRow).join('')}</div>`}
function filteredClients(){const q=state.search.trim().toLowerCase();return db.customers.filter(c=>(c.id+' '+c.nickname).toLowerCase().includes(q)).slice(0,6)}
function clientRow(c){const s=stats(c.id);return `<article class="client-row"><div class="cust-icon">${icon('user',22)}</div><div class="grow"><div class="cust-name">${esc(c.nickname)}</div><div class="cust-details">${esc(c.id)} · ${s.count} recensioni</div></div><button data-action="select-client" data-id="${esc(c.id)}">Apri ${icon('arrow',13)}</button></article>`}
function merchantClients(){const c=customer(state.selectedCustomer)||db.customers[0],s=stats(c.id),all=reviews(c.id),notes=db.notes.filter(n=>n.customerId===c.id);return `${title('Rubrica clienti','Clienti','Consulta i profili e le recensioni di esempio.')}
<div class="search">${icon('search',21)}<input id="client-search" type="search" placeholder="Cerca per nickname o ID" aria-label="Cerca un cliente" value="${esc(state.search)}" autocomplete="off"></div><div id="quick-results" class="stack" style="margin-top:10px">${filteredClients().map(clientRow).join('')||'<div class="empty">Nessun risultato.</div>'}</div>
<div class="section-heading"><h2>Scheda cliente</h2></div><div class="panel"><div class="row" style="margin-bottom:15px"><div class="cust-icon">${icon('user',26)}</div><div class="grow"><div class="cust-name" style="font-size:25px">${esc(c.nickname)}</div><div class="cust-details">${esc(c.id)}</div></div><span class="pill gold">${s.average}/${MAX_STARS}</span></div><div class="cols"><div class="mini-stat"><span>Recensioni</span><strong>${s.count}</strong></div><div class="mini-stat"><span>Positive (8–10)</span><strong>${s.positive}</strong></div></div><button class="button primary full" style="margin-top:15px" data-action="start-review" data-id="${esc(c.id)}">${icon('pen')} Recensisci questo cliente</button></div>
<div class="section-heading"><h2>Valutazioni ricevute</h2></div><div class="panel">${all.length?all.map(r=>reviewItem(r,false)).join(''):'<div class="empty">Nessuna valutazione.</div>'}</div>
<div class="section-heading"><h2>Note professionali</h2></div><div class="panel">${notes.length?notes.map(n=>`<div class="review-item"><div class="row between"><strong>${esc(n.restaurant)}</strong><span class="quiet">${fmt(n.date)}</span></div><p class="review-text">${esc(n.text)}</p></div>`).join(''):'<div class="empty">Nessuna nota per questo cliente.</div>'}<div class="info-alert">Le note sono visibili nella vista ristoratore di questa demo, ma non sono dati protetti. Nella versione reale saranno soggette a permessi, controllo degli accessi e diritti privacy.</div></div>`}
function merchantReview(){const d=state.draft,steps=['Verifica visita','Valutazione','Note'];return `${title('Nuova recensione','Racconta una visita','Tre passaggi chiari per una valutazione corretta e verificabile.')}
<div class="panel"><div class="tabs-steps">${steps.map((s,i)=>`<div class="step ${state.wizard===i+1?'active':state.wizard>i+1?'done':''}"><span>${state.wizard>i+1?icon('check',17):i+1}</span><label>${s}</label></div>`).join('')}</div>
${state.wizard===1?`<div class="stack"><h2 style="font-size:24px">1. Verifica la visita</h2><p class="quiet">Seleziona un cliente e conferma che abbia effettivamente visitato il ristorante.</p><div class="field"><label for="review-customer">Cliente</label><select id="review-customer">${db.customers.map(c=>`<option value="${esc(c.id)}" ${d.customer===c.id?'selected':''}>${esc(c.nickname)} · ${esc(c.id)}</option>`).join('')}</select></div><div class="field"><label for="visit-date">Data della visita</label><input id="visit-date" type="date" value="${esc(d.date)}" max="${today()}"></div><label class="chip ${d.confirmed?'selected':''}"><input type="checkbox" id="confirm-visit" ${d.confirmed?'checked':''}> Confermo che la visita è avvenuta</label><div class="info-alert">Nella demo la conferma è simulata. Nel servizio reale servirà una prova della visita, ad esempio un QR temporaneo o un riferimento alla prenotazione.</div></div>`:
state.wizard===2?`<div class="stack"><h2 style="font-size:24px">2. Come si è svolta la visita?</h2><p class="quiet">Valuta il comportamento durante l'esperienza, evitando giudizi personali non pertinenti.</p><div class="field"><label>Valutazione complessiva (1–10 stelle)</label><div class="rating-input" role="group" aria-label="Valutazione da una a dieci stelle">${Array.from({length:MAX_STARS},(_,i)=>i+1).map(n=>`<button type="button" aria-label="${n} ${n===1?'stella':'stelle'} su 10" aria-pressed="${d.rating===n?'true':'false'}" class="${n<=d.rating?'active':''} ${n===d.rating?'chosen':''}" data-action="rating" data-value="${n}"><span aria-hidden="true">★</span><span class="rate-num">${n}</span></button>`).join('')}</div><div class="quiet" style="text-align:center">${d.rating?`${d.rating} su ${MAX_STARS} stelle · <strong>${d.rating>=POSITIVE_MIN?'Valutazione positiva':'Non positiva per i premi'}</strong>`:'Seleziona una valutazione da 1 a 10 stelle'}</div></div><p class="quiet" style="text-align:center">Il cliente riceve una valutazione positiva soltanto con <strong>8, 9 o 10 stelle.</strong></p><div class="field"><label>Cosa descrive meglio la visita?</label><div class="option-row">${['Cortesia','Puntualità','Rispetto del personale','Comunicazione','Gestione prenotazione'].map(t=>`<label class="chip ${d.tags.includes(t)?'selected':''}"><input type="checkbox" data-tag="${esc(t)}" ${d.tags.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div></div><div class="field"><label for="review-text">Commento sulla visita</label><textarea id="review-text" maxlength="500" placeholder="Descrivi fatti osservabili, con un tono rispettoso...">${esc(d.text)}</textarea><small>Minimo 10 caratteri. Il cliente potrà leggerlo.</small></div></div>`:
`<div class="stack"><h2 style="font-size:24px">3. Ultimi dettagli</h2><div class="note-box"><div class="row">${icon('lock',22)}<h3>Nota professionale</h3></div><p class="quiet">Campo facoltativo. La nota sarà visibile nella vista ristoratore. Scrivi solo informazioni pertinenti e verificabili.</p><div class="field" style="margin-top:13px"><label for="note-text">Nota (facoltativa)</label><textarea id="note-text" maxlength="400" placeholder="Es. Preferisce ricevere conferma della prenotazione per messaggio...">${esc(d.note)}</textarea></div></div><div class="panel" style="box-shadow:none;background:#faf4eb"><h3 style="font-size:20px;margin-bottom:10px">Riepilogo della recensione</h3><p class="quiet">Cliente: <strong>${esc(customer(d.customer)?.nickname||'—')}</strong> · ${fmt(d.date)}</p><p class="quiet">Valutazione: <strong>${d.rating}/${MAX_STARS} (${d.rating>=POSITIVE_MIN?'positiva':'non positiva'})</strong></p><p class="quiet">Commento: ${esc(d.text)}</p></div><div class="info-alert warn">Non pubblicare accuse, dati sensibili o giudizi discriminatori. Le recensioni possono essere contestate e moderate.</div></div>`}
<div class="form-actions">${state.wizard>1?`<button class="button" data-action="prev">Indietro</button>`:''}<button class="button primary" data-action="${state.wizard===3?'publish':'next'}">${state.wizard===3?'Pubblica recensione':'Continua'} ${icon(state.wizard===3?'check':'arrow',16)}</button></div></div>`}
function merchantManage(){return `${title('Strumenti','Gestione','Tutto ciò che serve al ristoratore, senza menu complicati.')}
<div class="section-heading"><h2>Convalida un premio</h2></div><div class="panel stack"><p class="quiet">Inserisci il codice mostrato dal cliente. Un buono può essere utilizzato una volta sola.</p><form id="redeem-form" class="stack"><div class="field"><label for="voucher-code">Codice del buono</label><input id="voucher-code" name="code" placeholder="Es. BT-ABC12345" required autocapitalize="characters" autocomplete="off"></div><button class="button olive full" type="submit">${icon('gift')} Verifica e utilizza</button></form></div>
<div class="section-heading"><h2>Attività recenti</h2></div><div class="panel">${db.history.length?db.history.slice().reverse().slice(0,8).map(h=>`<div class="review-item"><strong>${esc(h.text)}</strong><div class="review-meta">${fmt(h.date)}</div></div>`).join(''):'<div class="empty">Le operazioni effettuate durante la demo compariranno qui.</div>'}</div>
<div class="section-heading"><h2>Abbonamento</h2></div><div class="panel"><h3 style="font-size:22px">Piano ristoratore</h3><p class="quiet" style="margin:10px 0">Per la versione reale sono previsti un abbonamento e la verifica del titolare. Nessun pagamento è attivo in questa anteprima.</p><span class="pill grey">Non ancora attivo</span></div>
<div class="section-heading"><h2>Demo e assistenza</h2></div><div class="panel stack"><button class="button full" data-action="reset">Ripristina i dati dimostrativi</button><p class="quiet">Il ripristino elimina soltanto i dati simulati salvati in questo browser.</p></div>`}
function render(){document.getElementById('app').innerHTML=header()}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.remove('show'),3100)}
function switchRole(role){state.role=role|| (state.role==='customer'?'restaurant':'customer');state.tab='home';state.search='';state.welcome=false;localStorage.setItem(WELCOME,'1');render();scrollToTop()}
function resetDraft(id){state.draft={customer:id||state.selectedCustomer,date:today(),confirmed:false,rating:0,tags:['Cortesia'],text:'',note:''};state.wizard=1}
function captureInputs(){let d=state.draft;if(state.tab!=='review'||state.role!=='restaurant')return;const date=document.getElementById('visit-date');if(date)d.date=date.value;const txt=document.getElementById('review-text');if(txt)d.text=txt.value;const note=document.getElementById('note-text');if(note)d.note=note.value}
function doNext(){captureInputs();const d=state.draft;if(state.wizard===1){if(!d.customer||!d.confirmed||!d.date||d.date>today()){notify('Seleziona cliente, data valida e conferma la visita.');return}}if(state.wizard===2){if(!Number.isInteger(d.rating)||d.rating<1||d.rating>MAX_STARS){notify('Scegli una valutazione da 1 a 10 stelle.');return}if(d.text.trim().length<10){notify('Scrivi almeno 10 caratteri sul comportamento osservato.');return}if(!d.tags.length){notify('Seleziona almeno una caratteristica della visita.');return}}state.wizard=Math.min(3,state.wizard+1);render();scrollToTop()}
function doPublish(){captureInputs();const d=state.draft;if(!d.confirmed||!d.customer||!d.date||d.date>today()||d.text.trim().length<10||!d.tags.length||!Number.isInteger(d.rating)||d.rating<1||d.rating>MAX_STARS){notify('Completa tutti i passaggi prima di pubblicare.');return}if(db.reviews.some(r=>r.customerId===d.customer&&r.restaurant===N&&r.date===d.date&&r.status!=='rimossa')){notify('È già presente una recensione per questa visita e data.');return}const r={id:'R'+rand(8),visitId:'V'+rand(8),customerId:d.customer,restaurant:N,date:d.date,rating:d.rating,tags:[...d.tags],text:d.text.trim(),status:'pubblicata'};db.reviews.push(r);if(d.note.trim())db.notes.push({id:'N'+rand(8),customerId:d.customer,restaurant:N,text:d.note.trim(),date:d.date});const s=stats(d.customer);let reward=false;if(s.positive>0&&s.positive%10===0&&db.vouchers.filter(v=>v.customerId===d.customer).length<s.positive/10){db.vouchers.push({code:'BT-'+rand(8),customerId:d.customer,status:'disponibile',date:today()});reward=true}reconcileVouchers(d.customer);db.history.push({date:today(),text:'Recensione pubblicata per '+customer(d.customer).nickname});state.selectedCustomer=d.customer;save();resetDraft(d.customer);state.tab='clients';render();scrollToTop();notify(reward?'Recensione pubblicata! Buono demo generato.':'Recensione pubblicata nella demo.')}
async function copyText(value){try{await navigator.clipboard.writeText(value);notify('Codice copiato.')}catch{notify('Codice: '+value)}}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){changeTab(tab.dataset.tab);return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'start':switchRole(a.dataset.role);break;case 'switch-role':switchRole();break;case 'select-client':state.selectedCustomer=a.dataset.id;state.tab='clients';render();scrollToTop();break;case 'start-review':resetDraft(a.dataset.id);state.tab='review';render();scrollToTop();break;case 'copy-id':copyText(customer(db.activeCustomer).id);break;case 'copy-code':copyText(a.dataset.code);break;case 'prev':captureInputs();state.wizard=Math.max(1,state.wizard-1);render();break;case 'next':doNext();break;case 'rating':{const v=Number(a.dataset.value);if(Number.isInteger(v)&&v>=1&&v<=MAX_STARS){captureInputs();state.draft.rating=v;render()}break;}case 'publish':doPublish();break;case 'dispute':{let r=db.reviews.find(r=>r.id===a.dataset.id&&r.customerId===db.activeCustomer);if(!r||r.status!=='pubblicata')return;if(!confirm('Inviare una contestazione dimostrativa su questa recensione?'))return;r.status='contestata';reconcileVouchers(db.activeCustomer);db.history.push({date:today(),text:'Recensione contestata da '+customer(db.activeCustomer).nickname});save();render();notify('Contestazione registrata nella demo.');break}case 'reset':if(confirm('Ripristinare la demo eliminando i dati simulati?')){db=seed();state.selectedCustomer='CL-10482';state.search='';state.tab='home';resetDraft('CL-10482');save();render();notify('Dati dimostrativi ripristinati.')}break;case 'export':{let c=customer(db.activeCustomer),d={profile:c,reviews:reviews(c.id),vouchers:db.vouchers.filter(v=>v.customerId===c.id)};let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='dati-demo-'+c.id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('File demo esportato.');break}}});
document.addEventListener('input',e=>{if(e.target.id==='client-search'){state.search=e.target.value;let el=document.getElementById('quick-results');if(el)el.innerHTML=filteredClients().map(clientRow).join('')||'<div class="empty">Nessun risultato.</div>'}if(e.target.id==='review-text')state.draft.text=e.target.value;if(e.target.id==='note-text')state.draft.note=e.target.value;if(e.target.id==='visit-date')state.draft.date=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='review-customer')state.draft.customer=e.target.value;if(e.target.id==='confirm-visit'){state.draft.confirmed=e.target.checked;e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.dataset.tag){const t=e.target.dataset.tag;state.draft.tags=e.target.checked?[...new Set([...state.draft.tags,t])]:state.draft.tags.filter(x=>x!==t);e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.id==='demo-customer'){db.activeCustomer=e.target.value;save();render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='nickname-form'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.id!==db.activeCustomer&&c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Nickname troppo corto o già utilizzato.');customer(db.activeCustomer).nickname=nick;save();render();notify('Nickname aggiornato.')}if(e.target.id==='create-customer'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Scegli un nickname diverso (almeno 3 caratteri).');let c={id:'CL-'+rand(7),nickname:nick};db.customers.push(c);db.activeCustomer=c.id;state.selectedCustomer=c.id;save();render();notify('Profilo dimostrativo creato.')}if(e.target.id==='redeem-form'){const code=e.target.code.value.trim().toUpperCase();const v=db.vouchers.find(v=>v.code===code);if(!v)return notify('Codice non trovato nella demo.');if(v.status!=='disponibile')return notify('Buono già utilizzato.');v.status='riscattato';v.redeemedAt=today();db.history.push({date:today(),text:'Buono '+v.code+' riscattato'});save();render();notify('Buono riscattato nella demo.')}});
render();save();if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
