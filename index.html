/* BUONTAVOLO V7 — atmosfera fotografica, transizioni inclusive */
:root{--motion-curve:cubic-bezier(.2,.75,.25,1)}
.screen-stage{min-width:0;view-transition-name:bt-screen;contain:layout}
.experience-cover,.reward-story{position:relative;overflow:hidden;isolation:isolate;border-radius:6px;margin:2px 0 19px;background:#233a30}
.experience-cover{height:173px;box-shadow:0 13px 28px #1f32211e}

.experience-index{font-size:9px;font-weight:750;letter-spacing:2px;color:#f1d3a7}

.experience-shade p em{color:#f5d3a9;font-style:italic}
.experience-credit{font-size:9px;letter-spacing:.2px;color:#e0d7c9}
.merchant-feature{background:#1d362e url('/media/sala.webp') center 48%/cover no-repeat;min-height:270px;border:1px solid #50624e}
.merchant-feature:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(18,36,29,.95) 0%,rgba(19,37,30,.83) 42%,rgba(19,37,30,.18) 100%)}

.merchant-feature-content{width:min(76%,440px)}
.merchant-feature h2{font-size:clamp(30px,4vw,42px);text-shadow:0 2px 9px #14261d7d}
.merchant-feature p{color:#e3e6df;text-shadow:0 1px 4px #15251e}
.merchant-feature .smallcaps{color:#ebca91}
.merchant-feature .feature-cta{background:#f2dfbd;color:#21372e;box-shadow:0 4px 12px #0003}
.merchant-feature .feature-cta:hover{background:#fff0d4}
.merchant-image-label{position:absolute;right:13px;bottom:11px;font-size:8px;font-weight:700;letter-spacing:1.2px;color:#eadbc2;opacity:.9}
.reward-story{height:164px;margin:20px 0 2px;border:1px solid #d6c4a8}
.reward-story:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#152820d9,#15282032);pointer-events:none}
.reward-story figcaption{position:absolute;inset:17px 20px;z-index:2;color:#fff4de;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.reward-story figcaption span{font-size:9px;letter-spacing:1.8px;font-weight:750;color:#f1d5a1}
.reward-story figcaption strong{font:normal clamp(23px,4vw,31px) var(--serif);margin:5px 0 10px}
.reward-story figcaption small{font-size:9px;color:#eee6d9}
.welcome{overflow:auto;max-height:min(95dvh,850px)}

.mobile-bottom button:active .nav-icon,.side-nav button:active,.role-choice:active{transform:scale(.95)}
.button:active{transform:scale(.985)}

@media(prefers-reduced-motion:no-preference){
  .screen-enter{animation:btScreenIn .25s var(--motion-curve) both}
  @keyframes btScreenIn{from{opacity:.15;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes btScreenOld{to{opacity:0;transform:translateY(-5px)}}

}

<body>
<div id="app" class="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const ICON={logo:'<path d="M5 3l14 18M19 3L5 21M6 3v7m3-7v7m4-7v7M18 3v5c0 2-1 3-3 4"/>',home:'<path d="m3 11 9-8 9 8v9H3z"/><path d="M9 20v-7h6v7"/>',reviews:'<path d="M4 5h16v12H9l-5 4z"/><path d="M8 9h8M8 13h6"/>',gift:'<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9C5 9 5 3 8 3c2 0 4 3 4 6Zm0 0c7 0 7-6 4-6-2 0-4 3-4 6Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/>',users:'<circle cx="9" cy="8" r="3"/><circle cx="18" cy="9" r="2"/><path d="M2 20c0-5 3-7 7-7s7 2 7 7zm14-6c3 0 6 2 6 6"/>',pen:'<path d="M4 20l4-.5L20 7l-4-4L4 15zM13.5 5.5l4 4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19 14 2 1-2 4-2-1a8 8 0 0 1-3 1l-.4 2h-4l-.4-2a8 8 0 0 1-3-1l-2 1-2-4 2-1a8 8 0 0 1 0-4l-2-1 2-4 2 1a8 8 0 0 1 3-1l.4-2h4l.4 2a8 8 0 0 1 3 1l2-1 2 4-2 1a8 8 0 0 1 0 4Z"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',award:'<circle cx="12" cy="9" r="6"/><path d="m8 15-1 7 5-3 5 3-1-7"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/>',arrow:'<path d="m9 18 6-6-6-6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m4 12 5 5L20 6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',logout:'<path d="M13 3H4v18h9M17 16l4-4-4-4M9 12h12"/>'};
const icon=(name,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.info}</svg>`;
const KEY='buontavolo-preview-v4',WELCOME='buontavolo-preview-onboard-v4',N='La Quercia';
const MAX_STARS=10, POSITIVE_MIN=8;
const today=(back=0)=>{let d=new Date();d.setDate(d.getDate()-back);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const fmt=(s)=>{try{return new Date(s+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}catch{return s}};
const seed=()=>{const customers=[{id:'CL-10482',nickname:'LunaBlu'},{id:'CL-10537',nickname:'Marco88'},{id:'CL-11028',nickname:'Sera27'}], places=['Trattoria Il Girasole','Osteria al Borgo','Ristorante La Quercia'];const notes=['Persona cortese e rispettosa nei confronti del personale.','Prenotazione rispettata, comunicazione chiara e comportamento corretto.','Visita piacevole: cliente disponibile e cordiale con la squadra.'];const reviews=Array.from({length:9},(_,i)=>({id:'R'+(101+i),customerId:'CL-10482',restaurant:places[i%3],date:today(i+2),rating:i%3===0?8:i%3===1?9:10,text:notes[i%3],tags:i%2?['Puntualità']:['Cortesia','Rispetto del personale'],status:'pubblicata',visitId:'S'+i}));reviews.push({id:'R200',customerId:'CL-10537',restaurant:places[1],date:today(4),rating:6,text:'Visita regolare, senza particolari osservazioni.',tags:['Comunicazione'],status:'pubblicata',visitId:'S200'},{id:'R201',customerId:'CL-11028',restaurant:places[2],date:today(3),rating:10,text:'Esperienza positiva, comportamento cordiale.',tags:['Cortesia'],status:'pubblicata',visitId:'S201'});return {customers,reviews,notes:[{id:'N1',customerId:'CL-10482',text:'Preferisce essere contattato per confermare eventuali variazioni alla prenotazione.',restaurant:N,date:today(8)}],vouchers:[],history:[],activeCustomer:'CL-10482'};};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!db.customers||!db.reviews||!db.vouchers)db=seed()}catch{db=seed()}
db.favorites=Array.isArray(db.favorites)?db.favorites:[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};
const state={role:localStorage.getItem(WELCOME)==='restaurant'?'restaurant':'customer',tab:'home',welcome:!localStorage.getItem(WELCOME),search:'',selectedCustomer:'CL-10482',wizard:1,draft:{customer:'CL-10482',date:today(),confirmed:false,rating:0,tags:['Cortesia'],text:'',note:''}};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rand=(n=6)=>{let a=new Uint32Array(n);crypto.getRandomValues(a);let c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return [...a].map(x=>c[x%c.length]).join('')};
const customer=(id)=>db.customers.find(c=>c.id===id);
const reviews=(id)=>db.reviews.filter(r=>r.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));
const valid=(r)=>r.status==='pubblicata';
const positive=(r)=>valid(r)&&r.rating>=POSITIVE_MIN;
const stats=(id)=>{const rr=reviews(id).filter(valid),p=rr.filter(positive);return {count:rr.length,positive:p.length,average:rr.length?(rr.reduce((s,r)=>s+r.rating,0)/rr.length).toFixed(1):'—',progress:p.length%10}};
const ratingText=(n)=>n>=9?'Ottima':n>=8?'Buona':n>=6?'Nella media':'Da migliorare';
function reconcileVouchers(id) {
  const vouchers = db.vouchers.filter(v => v.customerId === id);
  const earned = Math.floor(stats(id).positive / 10);
  const redeemed = vouchers.filter(v => v.status === 'riscattato').length;
  let remaining = Math.max(0, earned - redeemed);
  for (const voucher of vouchers) {
    if (voucher.status === 'riscattato') continue;
    voucher.status = remaining > 0 ? 'disponibile' : 'sospeso';
    if (remaining > 0) remaining--;
  }
}
const title=(eyebrow,t,desc='')=>`<div class="page-title"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(t)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div>`;
const nav=()=>state.role==='customer'?[['home','Home','home'],['reviews','Recensioni','reviews'],['rewards','Premi','gift'],['profile','Profilo','user']]:[['home','Home','home'],['clients','Clienti','users'],['review','Recensisci','pen'],['manage','Gestione','settings']];
let screenFallbackMotion=false;
const scrollToTop=()=>window.scrollTo({top:0,behavior:'instant'});
function transitionTo(update) {
  update();
  screenFallbackMotion = true;
  render();
  scrollToTop();
}
const changeTab=(tab)=>{if(state.tab===tab)return;transitionTo(()=>{state.tab=tab})};
const footer=()=>`<div class="banner">${icon('info',14)} <strong>Anteprima dimostrativa.</strong> Recensioni, visite, note e buoni sono simulati e salvati solo nel browser. Non inserire dati reali: non è presente autenticazione o protezione server.</div>`;
function header(){const entries=nav();const client=state.role==='customer';return `<div class="frame v6-app"><aside class="sidebar"><div class="side-brand"><span class="brand-symbol">${icon('logo',30)}</span><div><span class="brand-word">BuonTavolo<span class="brand-point">.</span></span><span class="brand-sub">La reputazione a tavola</span></div></div><div class="side-role">${client?'IL TUO SPAZIO':'SPAZIO RISTORATORE'}</div><nav class="side-nav" aria-label="Menu principale">${entries.map(([k,label,ic])=>`<button type="button" data-tab="${k}" class="${state.tab===k?'active':''}" ${state.tab===k?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('')}</nav><div class="side-bottom"><div class="sidebar-motto">Ogni incontro<br><em>lascia un segno.</em></div><button type="button" data-action="switch-role">${icon('logout',16)} Cambia modalità</button><small>Anteprima dimostrativa<br>Nessun dato reale.</small></div></aside><main class="main"><div class="inner"><header class="masthead"><div class="mast-name"><span class="brand-symbol">${icon('logo',21)}</span><span>BuonTavolo<span class="brand-point">.</span></span></div><div class="mast-right"><span class="demo-label">DEMO</span><button type="button" class="role-button" data-action="switch-role" aria-label="Passa alla vista ${client?'ristoratore':'cliente'}">${client?'Ristoratore':'Cliente'} ${icon('arrow',13)}</button></div></header><div class="screen-stage ${screenFallbackMotion?'screen-enter':''}" id="screen-stage">${body()}</div>${footer()}</div></main></div><nav class="mobile-bottom" aria-label="Navigazione mobile">${entries.map(([k,label,ic])=>`<button type="button" data-tab="${k}" aria-label="${label}" ${state.tab===k?'aria-current="page"':''} class="${state.tab===k?'active':''}"><span class="nav-icon">${icon(ic)}</span><span>${label}</span></button>`).join('')}</nav>${state.welcome?welcome():''}`}
function welcome(){return `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="w-title"><div class="welcome"><div class="welcome-image" role="img" aria-label="Atmosfera di un ristorante italiano con tavoli apparecchiati"></div><div class="welcome-mark">${icon('logo',34)}</div><div class="eyebrow">BUONTAVOLO · ANTEPRIMA</div><h1 id="w-title">C'è una storia<br>dietro ogni tavolo.</h1><p>Scopri come funziona la reputazione dei clienti nel mondo della ristorazione. Da quale lato vuoi iniziare?</p><button class="role-choice" data-action="start" data-role="customer"><span class="role-icon">${icon('user',27)}</span><span class="grow"><strong>Entro come cliente</strong><small>Tessera, recensioni e premi</small></span>${icon('arrow',18)}</button><button class="role-choice" data-action="start" data-role="restaurant"><span class="role-icon">${icon('pen',27)}</span><span class="grow"><strong>Entro come ristoratore</strong><small>Schede ospite e valutazioni</small></span>${icon('arrow',18)}</button><div class="welcome-note">Solo dati inventati. Nessun account reale richiesto.</div><a class="welcome-account" href="/account.html">Scopri la futura area account ${icon('arrow',14)}</a></div></div>`}
function body(){if(state.role==='customer')return ({home:clientHome,reviews:clientReviews,rewards:clientRewards,profile:clientProfile}[state.tab]||clientHome)();return ({home:merchantHome,clients:merchantClients,review:merchantReview,manage:merchantManage}[state.tab]||merchantHome)()}
function starLine(n){return `<span class="stars" aria-label="${n} stelle su 10">${'★'.repeat(Math.round(n))}${'☆'.repeat(Math.max(0,MAX_STARS-Math.round(n)))}</span>`}
function reviewItem(r,canDispute=false){return `<article class="review-item"><div class="review-restaurant"><div class="restaurant-seal">${icon('logo',23)}</div><div class="grow"><div class="review-date">${fmt(r.date)} · Visita recensita</div><h3>${esc(r.restaurant)}</h3></div><span class="review-score ${r.rating>=POSITIVE_MIN?'positive':''}"><strong>${r.rating}</strong><small>/10</small></span></div><p class="review-text">“${esc(r.text)}”</p><div class="review-footer"><span class="review-tags">${(r.tags||[]).slice(0,2).map(x=>`<span>${esc(x)}</span>`).join('')}</span>${canDispute&&r.status==='pubblicata'?`<button data-action="dispute" data-id="${esc(r.id)}">Contesta ${icon('arrow',13)}</button>`:r.status==='contestata'?'<span class="pill warn">In contestazione</span>':''}</div></article>`}
const level=(s)=>!s.count?'Da scoprire':Number(s.average)>=9?'Ospite eccellente':Number(s.average)>=8?'Ospite affidabile':'In evoluzione';
function stampRail(progress){return `<div class="stamp-rail" aria-label="${progress} recensioni positive su 10">${Array.from({length:10},(_,i)=>`<span class="stamp ${i<progress?'stamped':''}" aria-label="${i+1}: ${i<progress?'ottenuto':'da ottenere'}">${i<progress?icon('check',14):i+1}</span>`).join('')}</div>`}
function clientHome(){const c=customer(db.activeCustomer),s=stats(c.id),latest=reviews(c.id).slice(0,2),voucher=db.vouchers.some(v=>v.customerId===c.id&&v.status==='disponibile');return `<div class="section-intro"><div class="eyebrow">IL TUO PICCOLO MONDO A TAVOLA</div><h1>Benvenuto, <em>${esc(c.nickname)}.</em></h1><p>Una buona impressione ha sempre un seguito.</p></div>
<section class="experience-cover" aria-label="Atmosfera BuonTavolo"><img src="/media/sala.webp" width="1440" height="490" alt="Sala di un ristorante italiano accogliente, con tavoli apparecchiati e luci calde" fetchpriority="high" decoding="async"><div class="experience-shade"><span class="experience-index">01 / IL MONDO BUONTAVOLO</span><p>Le belle esperienze<br><em>lasciano il segno.</em></p><span class="experience-credit">Fotografia illustrativa</span></div></section>
<section class="passport" aria-label="Tessera di reputazione"><div class="passport-top"><div class="passport-brand">BUONTAVOLO <span>·</span> PASSAPORTO OSPITE</div><div class="passport-flower">✳</div></div><div class="passport-inner"><div class="passport-main"><span class="passport-label">TESSERA PERSONALE / N° ${esc(c.id.replace('CL-',''))}</span><h2>${esc(c.nickname)}</h2><div class="passport-line"></div><p class="passport-level">${icon('award',22)} ${level(s)}</p><div class="passport-footnote">${s.count} ${s.count===1?'visita recensita':'visite recensite'} · Identità demo</div></div><div class="passport-seal"><span>BT</span><small>OSPITE</small></div></div><div class="passport-bottom"><span>${s.average==='—'?'PRIMA VISITA':s.average+'/10 · MEDIA DELLE VALUTAZIONI'}</span><button data-action="copy-id">${icon('copy',15)} Copia ID</button></div></section>
<section class="reward-feature"><div class="reward-feature-head"><div><span class="eyebrow">IL TUO PERCORSO</span><h2>${voucher?'Un premio ti aspetta.':s.progress===9?'Un passo dal prossimo brindisi.':'Verso il prossimo premio.'}</h2></div><div class="reward-count"><strong>${s.progress}</strong><span>/10</span></div></div>${stampRail(s.progress)}<p>${voucher?'Hai un buono demo pronto da mostrare al ristorante.':s.progress===9?'Manca <strong>1</strong> recensione positiva per ottenere un buono.':`Mancano <strong>${10-s.progress}</strong> recensioni positive per ottenere un buono.`} Conta soltanto una valutazione da <strong>8 a 10 stelle</strong>.</p><button class="inline-link" data-tab="rewards">${voucher?'Vedi il tuo buono':'Scopri i premi'} ${icon('arrow',15)}</button></section>
<div class="section-heading editorial-heading"><h2>Le ultime esperienze<span class="heading-dot">.</span></h2><button class="text-action" data-tab="reviews">Tutte ${icon('arrow',14)}</button></div><div class="review-list">${latest.length?latest.map(r=>reviewItem(r,false)).join(''):'<div class="empty">La tua storia a tavola comincia con la prima visita.</div>'}</div><div class="mini-signoff">« La buona reputazione si riconosce dai piccoli gesti. »</div>`}
function clientReviews(){const rs=reviews(db.activeCustomer);return `${title('La tua storia','Le tue recensioni','Le valutazioni vanno da 1 a 10 stelle. Solo 8, 9 e 10 sono positive.')}<div class="panel"><div class="row between" style="margin-bottom:12px"><strong>${rs.length} recensioni</strong><span class="quiet">Le più recenti per prime</span></div>${rs.length?rs.map(r=>reviewItem(r,true)).join(''):'<div class="empty">Le tue recensioni appariranno qui dopo le visite.</div>'}</div><div class="info-alert">Puoi contestare una recensione. Nella versione reale la richiesta verrà esaminata da una persona prima di prendere decisioni definitive.</div>`}
function clientRewards(){const c=customer(db.activeCustomer),s=stats(c.id),vv=db.vouchers.filter(v=>v.customerId===c.id);const available=vv.filter(v=>v.status==='disponibile');return `${title('IL TUO PERCORSO','Piccoli gesti, grandi ricompense.','Ogni dieci visite valutate da 8 a 10 stelle ricevi un buono demo.')}
${available.length?available.map(v=>`<div class="ticket"><div class="ticket-top"><span>BUONTAVOLO · PREMIO DEMO</span>${icon('gift',23)}</div><h3>Il tuo buono fedeltà.</h3><p>Premio fedeltà · nessun valore economico</p><div class="ticket-code">${esc(v.code)}</div><button class="button olive full" data-action="copy-code" data-code="${esc(v.code)}">${icon('copy',16)} Copia il codice</button></div>`).join(''):''}
<div class="reward-feature rewards-page"><div class="reward-feature-head"><div><span class="eyebrow">LA TUA RACCOLTA</span><h2>Dieci buone impressioni.</h2></div><div class="reward-count"><strong>${s.progress}</strong><span>/10</span></div></div>${stampRail(s.progress)}<p>Ogni recensione da <strong>8 a 10 stelle</strong> vale un timbro. Alla decima recensione positiva viene creato un buono <em>dimostrativo</em>.</p></div>
${vv.filter(v=>v.status==='riscattato').length?`<div class="section-heading"><h2>Premi utilizzati</h2></div><div class="panel">${vv.filter(v=>v.status==='riscattato').map(v=>`<div class="row between"><span class="quiet">${esc(v.code)}</span><span class="pill grey">Utilizzato</span></div>`).join('')}</div>`:''}${vv.some(v=>v.status==='sospeso')?'<div class="info-alert">Un buono è sospeso perché una recensione è in contestazione.</div>':''}
<figure class="reward-story"><img src="/media/tavola.webp" width="1440" height="490" loading="lazy" decoding="async" alt="Piatto di pasta italiana con prodotti freschi su una tavola rustica"><figcaption><span>IL PIACERE DI TORNARE</span><strong>Ogni bella visita vale.</strong><small>Immagine illustrativa</small></figcaption></figure>
<div class="info-alert">I buoni della demo non hanno valore economico.</div>`}
function clientProfile(){const c=customer(db.activeCustomer);return `${title('Impostazioni','Il tuo profilo','Personalizza il nickname e trova il tuo identificativo.')}<div class="panel stack"><div><div class="smallcaps muted">Il tuo ID cliente</div><h2 style="font-size:26px;margin:9px 0">${esc(c.id)}</h2><p class="quiet">Condividilo con il ristorante quando vuoi collegare una visita.</p></div><button class="button" data-action="copy-id">${icon('copy')} Copia il mio ID</button><div class="divider" style="margin:2px 0"></div><form id="nickname-form" class="stack"><div class="field"><label for="nickname">Il tuo nickname</label><input id="nickname" name="nickname" maxlength="24" minlength="3" required value="${esc(c.nickname)}" autocomplete="off"><small>Sarà visibile ai ristoratori autorizzati.</small></div><button class="button olive full" type="submit">Salva le modifiche</button></form></div><div class="section-heading"><h2>Prova un altro profilo</h2></div><div class="panel stack"><div class="field"><label for="demo-customer">Scegli un cliente di esempio</label><select id="demo-customer">${db.customers.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.nickname)} · ${esc(x.id)}</option>`).join('')}</select></div><div class="divider" style="margin:0"></div><form id="create-customer" class="stack"><div class="field"><label for="new-nick">Oppure crea un profilo dimostrativo</label><input id="new-nick" name="nickname" placeholder="Scegli un nickname" required minlength="3" maxlength="24" autocomplete="off"></div><button type="submit" class="button">${icon('user')} Crea profilo demo</button></form></div><div class="section-heading"><h2>Privacy e dati</h2></div><div class="panel stack"><p class="quiet">Nella versione reale potrai accedere ai dati che ti riguardano, fare richieste di rettifica o cancellazione nei casi previsti e contestare le recensioni.</p><button class="button" data-action="export">Esporta i miei dati demo</button></div>`}
function merchantHome(){const list=db.customers.filter(c=>reviews(c.id).length>0),favorites=(db.favorites||[]).filter(id=>customer(id));return `<div class="section-intro merchant-intro"><div class="eyebrow">REGISTRO DI SALA / ${esc(N.toUpperCase())}</div><h1>Il servizio comincia <em>dall'attenzione.</em></h1><p>Conosci i tuoi ospiti. Lascia valutazioni corrette.</p></div>
<section class="merchant-feature"><div class="merchant-feature-content"><div class="smallcaps">IL TUO SPAZIO DI LAVORO</div><h2>Ogni tavolo<br>ha una storia<span class="heading-dot">.</span></h2><p>Una recensione alla volta, con rispetto e precisione.</p><button class="button feature-cta" data-tab="review">${icon('pen',17)} Scrivi una recensione ${icon('arrow',15)}</button></div><span class="merchant-image-label">IL TUO REGISTRO · DEMO</span></section>
<div class="section-heading editorial-heading"><h2>Trova un ospite<span class="heading-dot">.</span></h2><button class="text-action" data-tab="clients">Rubrica ${icon('arrow',13)}</button></div><div class="search search-feature">${icon('search',21)}<input id="client-search" type="search" placeholder="Nickname o ID cliente" aria-label="Cerca un cliente" value="${esc(state.search)}" autocomplete="off"></div><div id="quick-results" class="client-ledger">${filteredClients().map(clientRow).join('')}</div>
<div class="work-status"><div><span>CLIENTI NELLA DEMO</span><strong>${db.customers.length}</strong></div><div><span>RECENSIONI</span><strong>${db.reviews.length}</strong></div><div><span>OSPITI SALVATI</span><strong>${favorites.length}</strong></div></div>
<div class="section-heading editorial-heading"><h2>${favorites.length?'Da ritrovare':'Ultimi ospiti'}<span class="heading-dot">.</span></h2></div><div class="client-ledger">${(favorites.length?favorites.map(customer).filter(Boolean):list.slice(0,3)).map(clientRow).join('')}</div>`}
function filteredClients(){const q=state.search.trim().toLowerCase();return db.customers.filter(c=>(c.id+' '+c.nickname).toLowerCase().includes(q)).slice(0,6)}
function clientRow(c){const s=stats(c.id),favorite=(db.favorites||[]).includes(c.id);return `<article class="client-row"><div class="cust-icon">${esc(c.nickname.slice(0,1)).toUpperCase()}</div><div class="grow"><div class="cust-name">${esc(c.nickname)}</div><div class="cust-details">${esc(c.id)} · ${s.count} ${s.count===1?'recensione':'recensioni'}</div></div><div class="client-inline-score">${s.average==='—'?'—':s.average}<small>${s.average==='—'?'': '/10'}</small></div><button class="client-open" data-action="select-client" data-id="${esc(c.id)}" aria-label="Apri profilo di ${esc(c.nickname)}">${icon('arrow',19)}</button></article>`}
function merchantClients(){const c=customer(state.selectedCustomer)||db.customers[0],s=stats(c.id),all=reviews(c.id),notes=db.notes.filter(n=>n.customerId===c.id&&n.restaurant===N),favorite=(db.favorites||[]).includes(c.id);return `${title('REGISTRO OSPITI','Le persone, non solo i numeri.','Cerca un profilo per nickname o ID. I dati presenti sono inventati e locali a questo dispositivo.')}
<div class="search search-feature">${icon('search',21)}<input id="client-search" type="search" placeholder="Cerca per nickname o ID" aria-label="Cerca un cliente" value="${esc(state.search)}" autocomplete="off"></div><div id="quick-results" class="client-ledger">${filteredClients().map(clientRow).join('')||'<div class="empty">Nessun ospite trovato.</div>'}</div>
<div class="section-heading editorial-heading"><h2>Scheda ospite<span class="heading-dot">.</span></h2></div><div class="profile-snapshot"><div class="profile-snapshot-top"><div class="cust-icon large">${esc(c.nickname.slice(0,1)).toUpperCase()}</div><div class="grow"><span class="eyebrow">ID ${esc(c.id)}</span><h3>${esc(c.nickname)}</h3><span class="quiet">${level(s)}</span></div><button type="button" class="bookmark ${favorite?'saved':''}" data-action="toggle-favorite" data-id="${esc(c.id)}" aria-pressed="${favorite}" aria-label="${favorite?'Rimuovi dai preferiti':'Salva nei preferiti'}">${favorite?'★':'☆'}<small>${favorite?'Salvato':'Salva'}</small></button></div><div class="profile-metrics"><div><strong>${s.average}</strong><span>Media su 10</span></div><div><strong>${s.positive}</strong><span>Positive (8–10)</span></div><div><strong>${s.count}</strong><span>Recensioni</span></div></div><button class="button primary full" data-action="start-review" data-id="${esc(c.id)}">${icon('pen')} Valuta una visita ${icon('arrow',17)}</button></div>
<div class="section-heading editorial-heading"><h2>Esperienze passate<span class="heading-dot">.</span></h2></div><div class="review-list">${all.length?all.map(r=>reviewItem(r,false)).join(''):'<div class="empty">Ancora nessuna recensione.</div>'}</div>
<div class="section-heading editorial-heading"><h2>Appunti del locale<span class="heading-dot">.</span></h2></div><div class="private-notes"><div class="row">${icon('lock',18)}<strong>Solo note dimostrative del tuo locale</strong></div>${notes.length?notes.map(n=>`<div class="note-entry"><div class="quiet">${fmt(n.date)} · ${esc(n.restaurant)}</div><p>${esc(n.text)}</p></div>`).join(''):'<p class="quiet">Non ci sono appunti per questo ospite.</p>'}<p class="quiet" style="margin-top:12px">Questi dati non sono protetti: la condivisione tra ristoranti è disattivata e richiederà tutele specifiche.</p></div>`}
function merchantReview(){const d=state.draft,steps=['Verifica visita','Valutazione','Note'];return `${title('Nuova recensione','Racconta una visita','Tre passaggi chiari per una valutazione corretta e verificabile.')}
<div class="panel"><div class="tabs-steps">${steps.map((s,i)=>`<div class="step ${state.wizard===i+1?'active':state.wizard>i+1?'done':''}"><span>${state.wizard>i+1?icon('check',17):i+1}</span><label>${s}</label></div>`).join('')}</div>
${state.wizard===1?`<div class="stack"><h2 style="font-size:24px">1. Verifica la visita</h2><p class="quiet">Seleziona un cliente e conferma che abbia effettivamente visitato il ristorante.</p><div class="field"><label for="review-customer">Cliente</label><select id="review-customer">${db.customers.map(c=>`<option value="${esc(c.id)}" ${d.customer===c.id?'selected':''}>${esc(c.nickname)} · ${esc(c.id)}</option>`).join('')}</select></div><div class="field"><label for="visit-date">Data della visita</label><input id="visit-date" type="date" value="${esc(d.date)}" max="${today()}"></div><label class="chip ${d.confirmed?'selected':''}"><input type="checkbox" id="confirm-visit" ${d.confirmed?'checked':''}> Confermo che la visita è avvenuta</label><div class="info-alert">Nella demo la conferma è simulata. Nel servizio reale servirà una prova della visita, ad esempio un QR temporaneo o un riferimento alla prenotazione.</div></div>`:
state.wizard===2?`<div class="stack"><h2 style="font-size:24px">2. Come si è svolta la visita?</h2><p class="quiet">Valuta il comportamento durante l'esperienza, evitando giudizi personali non pertinenti.</p><div class="field"><label>Valutazione complessiva (1–10 stelle)</label><div class="rating-input" role="group" aria-label="Valutazione da una a dieci stelle">${Array.from({length:MAX_STARS},(_,i)=>i+1).map(n=>`<button type="button" aria-label="${n} ${n===1?'stella':'stelle'} su 10" aria-pressed="${d.rating===n?'true':'false'}" class="${n<=d.rating?'active':''} ${n===d.rating?'chosen':''}" data-action="rating" data-value="${n}"><span aria-hidden="true">★</span><span class="rate-num">${n}</span></button>`).join('')}</div><div class="quiet" style="text-align:center">${d.rating?`${d.rating} su ${MAX_STARS} stelle · <strong>${d.rating>=POSITIVE_MIN?'Valutazione positiva':'Non positiva per i premi'}</strong>`:'Seleziona una valutazione da 1 a 10 stelle'}</div></div><p class="quiet" style="text-align:center">Il cliente riceve una valutazione positiva soltanto con <strong>8, 9 o 10 stelle.</strong></p><div class="field"><label>Cosa descrive meglio la visita?</label><div class="option-row">${['Cortesia','Puntualità','Rispetto del personale','Comunicazione','Gestione prenotazione'].map(t=>`<label class="chip ${d.tags.includes(t)?'selected':''}"><input type="checkbox" data-tag="${esc(t)}" ${d.tags.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div></div><div class="field"><label for="review-text">Commento sulla visita</label><textarea id="review-text" maxlength="500" placeholder="Descrivi fatti osservabili, con un tono rispettoso...">${esc(d.text)}</textarea><small>Minimo 10 caratteri. Il cliente potrà leggerlo.</small></div></div>`:
`<div class="stack"><h2 style="font-size:24px">3. Ultimi dettagli</h2><div class="note-box"><div class="row">${icon('lock',22)}<h3>Nota professionale</h3></div><p class="quiet">Campo facoltativo. La nota sarà visibile nella vista ristoratore. Scrivi solo informazioni pertinenti e verificabili.</p><div class="field" style="margin-top:13px"><label for="note-text">Nota (facoltativa)</label><textarea id="note-text" maxlength="400" placeholder="Es. Preferisce ricevere conferma della prenotazione per messaggio...">${esc(d.note)}</textarea></div></div><div class="panel" style="box-shadow:none;background:#faf4eb"><h3 style="font-size:20px;margin-bottom:10px">Riepilogo della recensione</h3><p class="quiet">Cliente: <strong>${esc(customer(d.customer)?.nickname||'—')}</strong> · ${fmt(d.date)}</p><p class="quiet">Valutazione: <strong>${d.rating}/${MAX_STARS} (${d.rating>=POSITIVE_MIN?'positiva':'non positiva'})</strong></p><p class="quiet">Commento: ${esc(d.text)}</p></div><div class="info-alert warn">Non pubblicare accuse, dati sensibili o giudizi discriminatori. Le recensioni possono essere contestate e moderate.</div></div>`}
<div class="form-actions">${state.wizard>1?`<button class="button" data-action="prev">Indietro</button>`:''}<button class="button primary" data-action="${state.wizard===3?'publish':'next'}">${state.wizard===3?'Pubblica recensione':'Continua'} ${icon(state.wizard===3?'check':'arrow',16)}</button></div></div>`}
function merchantManage(){return `${title('Strumenti','Gestione','Tutto ciò che serve al ristoratore, senza menu complicati.')}
<div class="section-heading"><h2>Convalida un premio</h2></div><div class="panel stack"><p class="quiet">Inserisci il codice mostrato dal cliente. Un buono può essere utilizzato una volta sola.</p><form id="redeem-form" class="stack"><div class="field"><label for="voucher-code">Codice del buono</label><input id="voucher-code" name="code" placeholder="Es. BT-ABC12345" required autocapitalize="characters" autocomplete="off"></div><button class="button olive full" type="submit">${icon('gift')} Verifica e utilizza</button></form></div>
<div class="section-heading"><h2>Attività recenti</h2></div><div class="panel">${db.history.length?db.history.slice().reverse().slice(0,8).map(h=>`<div class="review-item"><strong>${esc(h.text)}</strong><div class="review-meta">${fmt(h.date)}</div></div>`).join(''):'<div class="empty">Le operazioni effettuate durante la demo compariranno qui.</div>'}</div>
<div class="section-heading"><h2>Abbonamento</h2></div><div class="panel"><h3 style="font-size:22px">Piano ristoratore</h3><p class="quiet" style="margin:10px 0">Per la versione reale sono previsti un abbonamento e la verifica del titolare. Nessun pagamento è attivo in questa anteprima.</p><span class="pill grey">Non ancora attivo</span></div>
<div class="section-heading"><h2>Demo e assistenza</h2></div><div class="panel stack"><button class="button full" data-action="reset">Ripristina i dati dimostrativi</button><p class="quiet">Il ripristino elimina soltanto i dati simulati salvati in questo browser.</p></div>`}
function render(){document.getElementById('app').innerHTML=header();screenFallbackMotion=false}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.remove('show'),3100)}
function switchRole(role){transitionTo(()=>{state.role=role|| (state.role==='customer'?'restaurant':'customer');state.tab='home';state.search='';state.welcome=false;localStorage.setItem(WELCOME,state.role)})}
function resetDraft(id){state.draft={customer:id||state.selectedCustomer,date:today(),confirmed:false,rating:0,tags:['Cortesia'],text:'',note:''};state.wizard=1}
function captureInputs(){let d=state.draft;if(state.tab!=='review'||state.role!=='restaurant')return;const date=document.getElementById('visit-date');if(date)d.date=date.value;const txt=document.getElementById('review-text');if(txt)d.text=txt.value;const note=document.getElementById('note-text');if(note)d.note=note.value}
function doNext(){captureInputs();const d=state.draft;if(state.wizard===1){if(!d.customer||!d.confirmed||!d.date||d.date>today()){notify('Seleziona cliente, data valida e conferma la visita.');return}}if(state.wizard===2){if(!Number.isInteger(d.rating)||d.rating<1||d.rating>MAX_STARS){notify('Scegli una valutazione da 1 a 10 stelle.');return}if(d.text.trim().length<10){notify('Scrivi almeno 10 caratteri sul comportamento osservato.');return}if(!d.tags.length){notify('Seleziona almeno una caratteristica della visita.');return}}transitionTo(()=>{state.wizard=Math.min(3,state.wizard+1)})}
function doPublish(){captureInputs();const d=state.draft;if(!d.confirmed||!d.customer||!d.date||d.date>today()||d.text.trim().length<10||!d.tags.length||!Number.isInteger(d.rating)||d.rating<1||d.rating>MAX_STARS){notify('Completa tutti i passaggi prima di pubblicare.');return}if(db.reviews.some(r=>r.customerId===d.customer&&r.restaurant===N&&r.date===d.date&&r.status!=='rimossa')){notify('È già presente una recensione per questa visita e data.');return}const r={id:'R'+rand(8),visitId:'V'+rand(8),customerId:d.customer,restaurant:N,date:d.date,rating:d.rating,tags:[...d.tags],text:d.text.trim(),status:'pubblicata'};db.reviews.push(r);if(d.note.trim())db.notes.push({id:'N'+rand(8),customerId:d.customer,restaurant:N,text:d.note.trim(),date:d.date});const s=stats(d.customer);let reward=false;if(s.positive>0&&s.positive%10===0&&db.vouchers.filter(v=>v.customerId===d.customer).length<s.positive/10){db.vouchers.push({code:'BT-'+rand(8),customerId:d.customer,status:'disponibile',date:today()});reward=true}reconcileVouchers(d.customer);db.history.push({date:today(),text:'Recensione pubblicata per '+customer(d.customer).nickname});state.selectedCustomer=d.customer;save();resetDraft(d.customer);state.tab='clients';render();scrollToTop();notify(reward?'Recensione pubblicata! Buono demo generato.':'Recensione pubblicata nella demo.')}
async function copyText(value){try{await navigator.clipboard.writeText(value);notify('Codice copiato.')}catch{notify('Codice: '+value)}}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){changeTab(tab.dataset.tab);return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'start':switchRole(a.dataset.role);break;case 'switch-role':switchRole();break;case 'select-client':transitionTo(()=>{state.selectedCustomer=a.dataset.id;state.tab='clients'});break;case 'start-review':transitionTo(()=>{resetDraft(a.dataset.id);state.tab='review'});break;case 'toggle-favorite':{const id=a.dataset.id;if(!customer(id))break;db.favorites=db.favorites||[];db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id];save();render();notify(db.favorites.includes(id)?'Ospite aggiunto ai salvati.':'Ospite rimosso dai salvati.');break;}case 'copy-id':copyText(customer(db.activeCustomer).id);break;case 'copy-code':copyText(a.dataset.code);break;case 'prev':captureInputs();transitionTo(()=>{state.wizard=Math.max(1,state.wizard-1)});break;case 'next':doNext();break;case 'rating':{const v=Number(a.dataset.value);if(Number.isInteger(v)&&v>=1&&v<=MAX_STARS){captureInputs();state.draft.rating=v;render()}break;}case 'publish':doPublish();break;case 'dispute':{let r=db.reviews.find(r=>r.id===a.dataset.id&&r.customerId===db.activeCustomer);if(!r||r.status!=='pubblicata')return;if(!confirm('Inviare una contestazione dimostrativa su questa recensione?'))return;r.status='contestata';reconcileVouchers(db.activeCustomer);db.history.push({date:today(),text:'Recensione contestata da '+customer(db.activeCustomer).nickname});save();render();notify('Contestazione registrata nella demo.');break}case 'reset':if(confirm('Ripristinare la demo eliminando i dati simulati?')){db=seed();state.selectedCustomer='CL-10482';state.search='';state.tab='home';resetDraft('CL-10482');save();render();notify('Dati dimostrativi ripristinati.')}break;case 'export':{let c=customer(db.activeCustomer),d={profile:c,reviews:reviews(c.id),vouchers:db.vouchers.filter(v=>v.customerId===c.id)};let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='dati-demo-'+c.id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('File demo esportato.');break}}});
function updateVisit(field, value) {
  const draft = state.draft;
  if (draft[field] === value) return;
  draft[field] = value;
  if (!draft.confirmed) return;
  draft.confirmed = false;
  const checkbox = document.getElementById('confirm-visit');
  if (checkbox) {
    checkbox.checked = false;
    checkbox.closest('.chip')?.classList.remove('selected');
  }
  notify('I dati della visita sono cambiati. Conferma di nuovo la visita.');
}
document.addEventListener('input',e=>{if(e.target.id==='client-search'){state.search=e.target.value;let el=document.getElementById('quick-results');if(el)el.innerHTML=filteredClients().map(clientRow).join('')||'<div class="empty">Nessun risultato.</div>'}if(e.target.id==='review-text')state.draft.text=e.target.value;if(e.target.id==='note-text')state.draft.note=e.target.value;if(e.target.id==='visit-date')updateVisit('date',e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='visit-date')updateVisit('date',e.target.value);if(e.target.id==='review-customer')updateVisit('customer',e.target.value);if(e.target.id==='confirm-visit'){state.draft.confirmed=e.target.checked;e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.dataset.tag){const t=e.target.dataset.tag;state.draft.tags=e.target.checked?[...new Set([...state.draft.tags,t])]:state.draft.tags.filter(x=>x!==t);e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.id==='demo-customer'){db.activeCustomer=e.target.value;save();render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='nickname-form'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.id!==db.activeCustomer&&c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Nickname troppo corto o già utilizzato.');customer(db.activeCustomer).nickname=nick;save();render();notify('Nickname aggiornato.')}if(e.target.id==='create-customer'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Scegli un nickname diverso (almeno 3 caratteri).');let c={id:'CL-'+rand(7),nickname:nick};db.customers.push(c);db.activeCustomer=c.id;state.selectedCustomer=c.id;save();render();notify('Profilo dimostrativo creato.')}if(e.target.id==='redeem-form'){const code=e.target.code.value.trim().toUpperCase();const v=db.vouchers.find(v=>v.code===code);if(!v)return notify('Codice non trovato nella demo.');if(v.status==='sospeso')return notify('Buono sospeso per una contestazione.');if(v.status!=='disponibile')return notify('Buono già utilizzato.');v.status='riscattato';v.redeemedAt=today();db.history.push({date:today(),text:'Buono '+v.code+' riscattato'});save();render();notify('Buono riscattato nella demo.')}});
db.customers.forEach(c=>reconcileVouchers(c.id));
render();save();if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
