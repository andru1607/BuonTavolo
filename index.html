/* GOODDINER V7.3 | The signature edition: no stock photography */
:root {--ink:#20362d;--metal:#d7b77c;--paper-glow:#fefaf1;--elevated:0 14px 40px rgba(23,42,30,.095)}
.v73-app .brand-word,.v73-app .mast-name{letter-spacing:-1.1px}
.v73-app .brand-point{display:inline-block;transform:scale(1.23);transform-origin:bottom left}
.v73-app .page-title h1,.v73-app .section-intro h1{letter-spacing:-1.25px;line-height:1.12;text-wrap:balance}
.v73-app .section-heading.editorial-heading{position:relative}
.v73-app .section-heading.editorial-heading h2{letter-spacing:-.8px}
.v73-app .eyebrow{letter-spacing:2.2px}
.v73-app .sidebar{background:linear-gradient(163deg,#203c30,#172b25 83%)}
.v73-app .side-brand .brand-symbol{box-shadow:0 0 0 5px rgba(230,206,154,.045)}
.v73-app .side-nav button{position:relative;transition:background .18s ease,color .18s ease,transform .18s ease}
.v73-app .side-nav button:hover{transform:translateX(2px)}
.v73-app .side-nav button.active{box-shadow:inset 3px 0 var(--metal),0 3px 20px rgba(0,0,0,.08)}
.v73-app .section-intro{position:relative}
.v73-app .section-intro:after{content:'';position:absolute;right:2px;top:3px;color:#b78c54;opacity:.42;font:23px Georgia,serif}
.v73-app .experience-cover{box-shadow:var(--elevated)}
.v73-app .merchant-feature{box-shadow:var(--elevated)}
/* The passport is the brand's signature object, with two accessible faces. */
.v73-app .passport-interactive{padding:0!important;min-height:322px;perspective:1400px;isolation:isolate;overflow:hidden;box-shadow:0 22px 40px rgba(15,44,28,.22),0 0 0 1px #ae9c7952}
.v73-app .passport-interactive:before,.v73-app .passport-interactive:after{display:none}
.v73-app .passport-rotor{height:322px;position:relative;transform-style:preserve-3d;transition:transform .68s cubic-bezier(.18,.78,.25,1)}
.v73-app .passport-interactive.is-flipped .passport-rotor{transform:rotateY(180deg)}
.v73-app .passport-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:22px 25px 0;overflow:hidden;background:radial-gradient(circle at 77% 11%,rgba(138,176,131,.2),transparent 46%),linear-gradient(140deg,#294b3c 0%,#1c342a 75%);border:1px solid #6e8d7050}
.v73-app .passport-face:before{content:'';position:absolute;inset:9px;border:1px solid rgba(222,194,132,.35);pointer-events:none}
.v73-app .passport-face:after{content:'';pointer-events:none;position:absolute;inset:0;z-index:0;opacity:.32;background:radial-gradient(ellipse 130px 110px at var(--shine-x,85%) var(--shine-y,12%),rgba(255,234,180,.53),transparent 75%),repeating-linear-gradient(113deg,transparent 0,transparent 10px,rgba(240,213,153,.012) 11px,transparent 12px)}
.v73-app .passport-front > *,.v73-app .passport-back > *{position:relative;z-index:1}
.v73-app .passport-front{transform:rotateY(0)}
.v73-app .passport-back{transform:rotateY(180deg);background:radial-gradient(circle at 20% 13%,#416354,#1d382d 78%)}
.v73-app .passport-inner{flex:1;min-height:170px}
.v73-app .passport-seal{filter:drop-shadow(0 0 14px rgba(231,202,136,.13));border-color:#dcc58a}
.v73-app .passport-inner h2{font-size:clamp(34px,7vw,52px)}
.v73-app .passport-bottom{margin-top:auto;min-height:50px}

.v73-app .passport-back-head{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Collectible stamps, not a basic progress bar. */
.v73-app .stamp-rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(3px,1.3vw,8px);margin:22px 0 12px}
.v73-app .stamp{width:100%;max-width:none;aspect-ratio:1;min-width:0;height:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font:700 clamp(10px,1.8vw,12px) var(--serif);color:#a79375;border:1px dashed #b7a88d;position:relative;transform:none;background:#ede4d5}

.v73-app .hallmark-head h3{font-size:21px;letter-spacing:-.4px}
.v73-app .hallmark-head small{color:var(--muted);font-size:11px}
.v73-app .hallmark-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.v73-app .hallmark{min-width:0;min-height:102px;background:#fdf9f0;border:1px solid #dbcfb9;border-radius:14px;padding:13px 7px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.v73-app .hallmark:after{content:'';position:absolute;inset:4px;border:1px solid #efe5d5;border-radius:10px;pointer-events:none}
.v73-app .hallmark .mark-icon{width:36px;height:36px;border-radius:50%;background:#e8e6da;color:#355643;display:grid;place-items:center;border:1px solid #d5c8ad}
.v73-app .hallmark strong{font-size:12px;line-height:1.2;color:#314a3b;overflow-wrap:anywhere}
.v73-app .hallmark small{font-size:10px;color:#897b65}
.v73-app .hallmark-empty{padding:17px 16px;border:1px dashed #cdbca0;color:#6a685c;font-size:12px;border-radius:12px;background:#faf5eb}
/* Bottom navigation now feels like a carefully-made dock rather than four generic buttons. */
@media(max-width:770px){
.v73-app ~ .mobile-bottom{border:1px solid #eadccc;border-bottom:0;background:rgba(252,249,241,.97);box-shadow:0 -8px 26px #2b362022;padding:8px 10px calc(7px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;overflow:visible}
.v73-app ~ .mobile-bottom button{gap:3px;min-height:55px;color:#746e60;font-size:10px;transition:transform .2s ease}
.v73-app ~ .mobile-bottom button:active{transform:scale(.94)}
.v73-app ~ .mobile-bottom .nav-icon{width:43px;height:32px;display:grid;place-items:center;border-radius:16px;transition:background .22s ease,color .22s ease,transform .24s ease}
.v73-app ~ .mobile-bottom button.active .nav-icon{background:var(--olive);color:#fef4df;transform:translateY(-2px);box-shadow:0 4px 12px #1b3b2b24}
.v73-app ~ .mobile-bottom button.active{color:var(--olive)}
.v73-app ~ .mobile-bottom button.active:after{content:'';width:4px;height:4px;background:var(--wine);border-radius:100%;position:absolute;bottom:0}
.v73-app .passport-interactive,.v73-app .passport-rotor{min-height:316px;height:316px}
.v73-app .passport-face{padding:21px 21px 0}
.v73-app .passport-inner{min-height:155px}
.v73-app .hallmark{min-height:98px}
}
@media(min-width:771px) and (max-width:1000px){.v73-app .hallmark-grid{gap:12px}}
/* Intentional identity without generic restaurant photography. */
.v73-app .restaurant-preview{box-shadow:var(--elevated)}
.v73-app .restaurant-preview-copy{position:relative}
.v73-app .restaurant-preview-copy:after{content:'GD';position:absolute;right:9px;bottom:9px;font:italic 28px Georgia,serif;color:#bfa9823f;pointer-events:none}
.v73-app .profile-studio,.v73-app .venue-story-editor{box-shadow:0 8px 24px rgba(41,53,34,.045)}
.v73-app .studio-upload{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.v73-app .studio-upload:active{transform:scale(.995)}
.v73-app .studio-upload:hover{box-shadow:0 6px 18px rgba(21,41,28,.09);border-color:#a58f66}
.v73-app .ticket{box-shadow:var(--elevated);position:relative}
.v73-app .ticket:before,.v73-app .ticket:after{content:'';position:absolute;top:50%;width:17px;height:17px;background:var(--cream);border:1px solid #d8c49f;border-radius:50%;transform:translateY(-50%)}
.v73-app .ticket:before{left:-9px}.v73-app .ticket:after{right:-9px}
.v73-app .reward-feature,.v73-app .profile-snapshot{box-shadow:0 5px 23px rgba(43,57,36,.055)}
/* Muted on-purpose celebration, created only when demo voucher is actually awarded. */
.reward-celebration{position:fixed;pointer-events:none;inset:0;z-index:70;display:grid;place-items:center;background:rgba(22,48,35,.17);animation:celebrate-bg .9s ease both}
.reward-celebration .celebrate-seal{height:104px;width:104px;display:grid;place-items:center;background:#264738;color:#eedcae;border:2px solid #ddc594;box-shadow:0 0 0 11px rgba(246,239,218,.62),0 13px 40px #172b2b3a;border-radius:50%;font:44px Georgia,serif;animation:celebrate-rise .85s cubic-bezier(.16,1,.3,1) both}
.reward-celebration .celebrate-seal:after{content:'PREMIO';position:absolute;font:600 9px sans-serif;letter-spacing:1.7px;transform:translateY(33px)}
@keyframes celebrate-bg{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
@keyframes celebrate-rise{0%{transform:translateY(22px) scale(.77) rotate(-12deg);opacity:0}55%{transform:translateY(-5px) scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
.v73-app .button:active{transform:scale(.985)}
.v73-app .button{transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
@media(hover:hover){.v73-app .button:hover{box-shadow:0 5px 14px #1e3b3022}}

.v73-app .venue-gallery-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 11px 14px}.v73-app .venue-gallery-mini img{height:96px;width:100%;object-fit:cover;border-radius:9px;display:block} @media(max-width:380px){.v73-app .venue-gallery-mini img{height:76px}}

.v73-app .star-empty svg{fill:none;stroke:#c8bdab}

.v73-app .reward-feature:before,.v73-app .review-list .review-item:before,.v73-app .venue-story-editor:after{display:none!important}

.v73-app .welcome-image b{font:600 45px/1 system-ui,sans-serif;letter-spacing:-4px}

.v73-app .brand-symbol{border:0;background:transparent;border-radius:0}
.v73-app .brand-symbol svg{color:#F6EFE2;stroke:none;max-width:100%;max-height:100%}
.v73-app .mast-name .brand-symbol svg{color:#F6EFE2}
.v73-app .welcome-mark svg{stroke:none}

// Compatibilita: chiavi demo storiche non rinominate, cosi i dati locali restano visibili.
const KEY='buontavolo-preview-v4',WELCOME='buontavolo-preview-onboard-v4',N='La Quercia';
const MAX_STARS=10, POSITIVE_MIN=8;
const PHOTO_KEY='buontavolo-local-photoprofile-v71';
const PHOTO_SLOTS=['cover','logo','gallery1','gallery2','gallery3'];
const STORY_KEY='buontavolo-local-story-v72';
const STYLES=['Accogliente','Tradizionale','Contemporaneo','Informale'];
const storyDefault=()=>({tagline:'Un incontro alla volta, con cura.',style:'Accogliente'});
let merchantStory=storyDefault();
try{const stored=JSON.parse(localStorage.getItem(STORY_KEY)||'null');if(stored&&typeof stored==='object'){merchantStory={tagline:typeof stored.tagline==='string'?stored.tagline.slice(0,88):merchantStory.tagline,style:STYLES.includes(stored.style)?stored.style:merchantStory.style}}}catch{}
const storyTagline=()=>merchantStory.tagline.trim()||'Un incontro alla volta, con cura.';

let merchantPhotos={};
try{const savedPhotos=JSON.parse(localStorage.getItem(PHOTO_KEY)||'{}');if(savedPhotos&&typeof savedPhotos==='object')for(const slot of PHOTO_SLOTS){if(typeof savedPhotos[slot]==='string'&&/^data:image\/(webp|jpeg|png);base64,/.test(savedPhotos[slot])&&savedPhotos[slot].length<1700000)merchantPhotos[slot]=savedPhotos[slot]}}catch{}

const today=(back=0)=>{let d=new Date();d.setDate(d.getDate()-back);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const fmt=(s)=>{try{return new Date(s+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}catch{return s}};
const seed=()=>{const customers=[{id:'CL-10482',nickname:'LunaBlu'},{id:'CL-10537',nickname:'Marco88'},{id:'CL-11028',nickname:'Sera27'}], places=['Trattoria Il Girasole','Osteria al Borgo','Ristorante La Quercia'];const notes=['Persona cortese e rispettosa nei confronti del personale.','Prenotazione rispettata, comunicazione chiara e comportamento corretto.','Visita piacevole: cliente disponibile e cordiale con la squadra.'];const reviews=Array.from({length:9},(_,i)=>({id:'R'+(101+i),customerId:'CL-10482',restaurant:places[i%3],date:today(i+2),rating:i%3===0?8:i%3===1?9:10,text:notes[i%3],tags:i%2?['Puntualità']:['Cortesia','Rispetto del personale'],status:'pubblicata',visitId:'S'+i}));reviews.push({id:'R200',customerId:'CL-10537',restaurant:places[1],date:today(4),rating:6,text:'Visita regolare, senza particolari osservazioni.',tags:['Comunicazione'],status:'pubblicata',visitId:'S200'},{id:'R201',customerId:'CL-11028',restaurant:places[2],date:today(3),rating:10,text:'Esperienza positiva, comportamento cordiale.',tags:['Cortesia'],status:'pubblicata',visitId:'S201'});return {customers,reviews,notes:[{id:'N1',customerId:'CL-10482',text:'Preferisce essere contattato per confermare eventuali variazioni alla prenotazione.',restaurant:N,date:today(8)}],vouchers:[],history:[],activeCustomer:'CL-10482'};};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!db.customers||!db.reviews||!db.vouchers)db=seed()}catch{db=seed()}
db.favorites=Array.isArray(db.favorites)?db.favorites:[];
db.recentGuests=Array.isArray(db.recentGuests)?db.recentGuests.filter(id=>db.customers.some(c=>c.id===id)).slice(0,4):[];
const rememberGuest=(id)=>{if(customer(id)){db.recentGuests=[id,...db.recentGuests.filter(x=>x!==id)].slice(0,4);save()}};

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};
const state={role:'customer',tab:'home',welcome:!localStorage.getItem(WELCOME),search:'',selectedCustomer:'CL-10482',wizard:1,passportFlipped:false,draft:{customer:'CL-10482',date:today(),confirmed:false,rating:0,tags:['Cortesia'],text:'',note:''}};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rand=(n=6)=>{let a=new Uint32Array(n);crypto.getRandomValues(a);let c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return [...a].map(x=>c[x%c.length]).join('')};
const customer=(id)=>db.customers.find(c=>c.id===id);
const reviews=(id)=>db.reviews.filter(r=>r.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));
const valid=(r)=>r.status==='pubblicata';
const positive=(r)=>valid(r)&&r.rating>=POSITIVE_MIN;

async function setMerchantPhoto(slot,file){if(state.role!=='restaurant'||!PHOTO_SLOTS.includes(slot)||!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>6*1024*1024){notify('Scegli una foto JPG, PNG o WebP sotto i 6 MB.');return;}
 const blobUrl=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=blobUrl});if(!img.naturalWidth||!img.naturalHeight)throw Error('Immagine non valida');
 const limits=slot==='cover'?[1300,760]:slot==='logo'?[420,420]:[900,900],scale=Math.min(1,limits[0]/img.naturalWidth,limits[1]/img.naturalHeight);
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
 const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas non disponibile');ctx.drawImage(img,0,0,canvas.width,canvas.height);
 let encoded=canvas.toDataURL('image/webp',.72);if(!encoded.startsWith('data:image/webp'))encoded=canvas.toDataURL('image/jpeg',.75);
 const prev=merchantPhotos;const next={...merchantPhotos,[slot]:encoded};if(JSON.stringify(next).length>4_400_000)throw Error('Spazio foto quasi pieno');
 try{localStorage.setItem(PHOTO_KEY,JSON.stringify(next))}catch(err){merchantPhotos=prev;throw err}
 merchantPhotos=next;render();notify('Foto del locale salvata solo in questo browser.');
 }catch{notify('Impossibile salvare: prova una foto più piccola o libera spazio nel browser.');}finally{URL.revokeObjectURL(blobUrl)}
}

document.addEventListener('input',e=>{if(e.target.id==='client-search'){state.search=e.target.value;let el=document.getElementById('quick-results');if(el)el.innerHTML=filteredClients().map(clientRow).join('')||emptyScene('search','Nessun risultato','Prova un nickname o un ID diverso.')}if(e.target.id==='review-text')state.draft.text=e.target.value;if(e.target.id==='note-text')state.draft.note=e.target.value;if(e.target.id==='visit-date')state.draft.date=e.target.value});
document.addEventListener('change',e=>{if(e.target.matches('[data-photo-slot]')){setMerchantPhoto(e.target.dataset.photoSlot,e.target.files?.[0]);return;}if(e.target.id==='review-customer')state.draft.customer=e.target.value;if(e.target.id==='confirm-visit'){state.draft.confirmed=e.target.checked;e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.dataset.tag){const t=e.target.dataset.tag;state.draft.tags=e.target.checked?[...new Set([...state.draft.tags,t])]:state.draft.tags.filter(x=>x!==t);e.target.closest('.chip')?.classList.toggle('selected',e.target.checked)}if(e.target.id==='demo-customer'){db.activeCustomer=e.target.value;save();render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='nickname-form'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.id!==db.activeCustomer&&c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Nickname troppo corto o già utilizzato.');customer(db.activeCustomer).nickname=nick;save();render();notify('Nickname aggiornato.')}if(e.target.id==='create-customer'){const nick=e.target.nickname.value.trim();if(nick.length<3||db.customers.some(c=>c.nickname.toLowerCase()===nick.toLowerCase()))return notify('Scegli un nickname diverso (almeno 3 caratteri).');let c={id:'CL-'+rand(7),nickname:nick};db.customers.push(c);db.activeCustomer=c.id;state.selectedCustomer=c.id;save();render();notify('Profilo dimostrativo creato.')}if(e.target.id==='venue-story-form'){
 if(state.role!=='restaurant')return;
 const tagline=String(e.target.elements.tagline.value||'').trim();const style=e.target.elements.style.value;
 if(tagline.length<6||tagline.length>88||!STYLES.includes(style))return notify('Scrivi una frase tra 6 e 88 caratteri e scegli lo stile.');
 const next={tagline,style};try{localStorage.setItem(STORY_KEY,JSON.stringify(next));merchantStory=next;render();notify('L’identità del tuo locale è aggiornata nella demo.')}catch{notify('Non riesco a salvare in questo browser.')}return;
 }if(e.target.id==='redeem-form'){const code=e.target.code.value.trim().toUpperCase();const v=db.vouchers.find(v=>v.code===code);if(!v)return notify('Codice non trovato nella demo.');if(v.status!=='disponibile')return notify('Buono già utilizzato.');v.status='riscattato';v.redeemedAt=today();db.history.push({date:today(),text:'Buono '+v.code+' riscattato'});save();render();notify('Buono riscattato nella demo.')}});
render();save();if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
