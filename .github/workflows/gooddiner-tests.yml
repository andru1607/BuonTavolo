name: GoodDiner quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Verified HTTPS origin of GoodDiner (without path)'
        required: true
        type: string
      registrations_open:
        description: 'Expect explicitly approved public registration'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests and official release tests
        run: npm test
      - name: JavaScript syntax
        run: node --check official.js && node --check auth-feedback.js && node --check business.js && node --check turnstile.js && node --check client-export.js && node --check scripts/live-smoke.mjs
      - name: Live smoke (verified HTTPS origin only)
        if: ${{ github.ref == 'refs/heads/main' && (vars.GOODDINER_BASE_URL != '' || github.event_name == 'workflow_dispatch') }}
        env:
          GOODDINER_BASE_URL: ${{ inputs.base_url || vars.GOODDINER_BASE_URL }}
          GOODDINER_EXPECT_REGISTRATION_OPEN: ${{ inputs.registrations_open || 'false' }}
        run: node scripts/live-smoke.mjs
      - name: Explain skipped live smoke
        if: ${{ github.ref == 'refs/heads/main' && vars.GOODDINER_BASE_URL == '' && github.event_name != 'workflow_dispatch' }}
        run: echo "::warning::GOODDINER_BASE_URL not configured; live HTTPS deployment has NOT been verified."
