name: GoodDiner quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests and official release tests
        run: npm test
      - name: JavaScript syntax
        run: node --check official.js && node --check turnstile.js && node --check scripts/live-smoke.mjs
      - name: Live smoke (requires configured canonical URL)
        if: ${{ github.ref == 'refs/heads/main' && vars.GOODDINER_BASE_URL != '' }}
        env:
          GOODDINER_BASE_URL: ${{ vars.GOODDINER_BASE_URL }}
        run: node scripts/live-smoke.mjs
