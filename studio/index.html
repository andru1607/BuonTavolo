ction><p id="message" role="status" aria-live="polite" hidden></p><section id="workspace" hidden><div class="top"><div><p class="eyebrow">GOODDINER / STUDIO</p><h1 id="title">Panoramica</h1></div><button id="refresh">Aggiorna</button></div><p id="updated" class="muted"></p><div id="view"></div></section></main><nav id="nav" hidden><button data-tab="home">⌂<span>Home</span></button><button data-tab="requests">▤<span>Richieste</span></button><button data-tab="invites">＋<span>Inviti</span></button><button data-tab="tools">⚙<span>Strumenti</span></button></nav><dialog id="modal"><form id="decisionform"><h2 id="modalTitle"></h2><p id="modalInfo"></p><label id="statuswrap" hidden>Stato<select id="licenseStatus"><option value="active">Attiva</option><option value="trialing">Prova</option><option value="suspended">Sospesa</option></select></label><label id="datewrap" hidden>Scadenza<input id="until" type="date"></label><label>Motivazione (10–500 caratteri)<textarea id="note" minlength="10" maxlength="500" required></textarea></label><label id="proofwrap" class="check" hidden><input id="proof" type="checkbox">Ho verificato indipendentemente la titolarità del ristorante.</label><div class="actions"><button type="button" id="cancel">Annulla</button><button class="primary">Conferma</button></div></form></dialog></body></html>
