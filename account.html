*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;background:var(--cream);min-height:100dvh;-webkit-tap-highlight-color:transparent}a{color:inherit}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.52;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ad9363;outline-offset:2px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}p{line-height:1.55}svg{width:22px;height:22px;flex:none}.shell{max-width:720px;margin:0 auto;min-height:100dvh;padding:0 18px calc(86px + env(safe-area-inset-bottom))}.top{margin:0 -18px 22px;background:var(--olive);color:#fff8eb;padding:calc(18px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 19px;display:flex;gap:12px;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-size:26px}.brand-icon{border:1px solid #8a906c;border-radius:12px;height:39px;width:39px;display:grid;place-items:center;color:#f1e0ab;font-weight:700;font-family:Arial,sans-serif;font-size:17px}.back{font-size:12px;color:#e0d4bc;text-decoration:none;border:1px solid #647153;border-radius:20px;padding:9px 12px}.eyebrow{text-transform:uppercase;color:#8c7957;letter-spacing:2px;font-weight:700;font-size:10px;margin-bottom:9px}.headline{font-size:clamp(30px,7vw,40px);line-height:1.12;margin-bottom:12px;color:var(--olive)}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted);line-height:1.5}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}.panel h2{font-size:22px;color:var(--olive);margin-bottom:10px}.stack{display:grid;gap:15px}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700;color:#4c4538}.field input,.field textarea{min-height:50px;padding:12px 13px;border-radius:10px;border:1px solid #d7cbbb;background:#fff;color:var(--text);width:100%;font-size:16px}.field textarea{min-height:108px;resize:vertical}.hint{color:var(--muted);font-size:12px;line-height:1.5}.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:11px;padding:13px 16px;min-height:49px;background:var(--paper);color:var(--olive);border:1px solid #d6cbb9;font-weight:700;font-size:14px;text-decoration:none}.btn.fill{width:100%}.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}.btn.olive{background:var(--olive);border-color:var(--olive);color:#fff}.btn.text{background:transparent;border:0;padding:10px;color:var(--wine);min-height:40px}.btn.sm{min-height:41px;padding:10px 12px;font-size:12px}.btn:active{transform:translateY(1px)}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role-card{padding:16px 12px;border:1px solid var(--line);border-radius:12px;background:#faf7ee;text-align:left;color:var(--text);min-height:100px}.role-card strong{display:block;font-family:Georgia,serif;font-size:19px;font-weight:400;margin-bottom:7px}.role-card small{color:var(--muted);line-height:1.5}.role-card[aria-pressed=true]{background:#edf0e5;border-color:#536842;box-shadow:inset 0 0 0 1px #536842}.auth-tabs{display:flex;background:#eae1d5;padding:4px;border-radius:12px;gap:4px;margin-bottom:18px}.auth-tabs button{flex:1;border:0;border-radius:9px;padding:12px 8px;color:#6c6254;background:transparent;font-size:14px;font-weight:700}.auth-tabs button[aria-selected=true]{background:#fffdf8;color:var(--olive);box-shadow:0 2px 7px #51423216}.notice{padding:14px 15px;border-radius:12px;border:1px solid #e0d2ba;background:#f2ebde;color:#655643;font-size:13px;line-height:1.5;margin-bottom:16px}.notice.good{border-color:#c4d7b4;background:#f0f4ea;color:#35552e}.notice.alert{border-color:#edc4bf;background:#fbeeea;color:#892f35}.section-title{font-family:Georgia,serif;color:var(--olive);font-size:23px;margin:22px 0 12px}.member{background:var(--olive);color:#faf4e8;padding:23px 22px;border-radius:17px;position:relative;overflow:hidden}.member:after{content:'';position:absolute;border:1px solid #bea26f44;border-radius:100% 0 80% 20%;width:180px;height:215px;right:-65px;bottom:-80px;transform:rotate(28deg)}.member h2{font-family:Georgia,serif;font-size:31px;margin:10px 0 5px;position:relative;z-index:1}.member small{position:relative;z-index:1;color:#decdaa}.member .line{height:1px;background:#928c63;width:65%;margin:22px 0 15px}.member .status{color:#e6d2a0;font-family:Georgia,serif;font-size:19px}.metric{display:flex;align-items:center;justify-content:space-between;gap:12px}.metric strong{font-family:Georgia,serif;color:var(--olive);font-size:28px;font-weight:400}.track{background:#eee5d8;border-radius:30px;height:12px;overflow:hidden;margin:15px 0 9px}.track>div{height:100%;background:#4e6334;border-radius:inherit;transition:width .25s}.review{border-bottom:1px solid var(--line);padding:14px 0}.review:last-child{border-bottom:0;padding-bottom:0}.review h3{font-size:19px;margin-bottom:4px}.review .date{font-size:12px;color:var(--muted)}.review p{font-size:14px;margin-top:10px}.score{color:#936936;font-size:13px;font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:30px;background:#e9eddf;color:#486036;font-size:11px;font-weight:800}.badge.wait{background:#f7ece0;color:#805733}.badge.warn{background:#fae7e1;color:#97343b}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px;overflow-wrap:anywhere;word-break:break-word;font-size:15px;background:#f2ecdf;border:1px dashed #c9bba6;padding:12px;border-radius:10px}.divider{height:1px;background:var(--line);margin:14px 0}.compact{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fdfbf5;margin-bottom:10px}.compact:last-child{margin-bottom:0}.compact h3{font-size:19px;margin:0 0 4px}.rating-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:6px 0}.rating{border:1px solid #d8c9b5;background:#fcf8ef;padding:12px 4px;border-radius:9px;min-height:47px;font-weight:800;color:#634e31}.rating[aria-pressed=true]{color:white;background:var(--olive);border-color:var(--olive)}.rating-note{color:#695b4b;font-size:12px}.bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--line);z-index:5}.bottom-inner{display:flex;width:min(100%,720px);justify-content:space-around;padding:9px 5px 8px}.bottom button{flex:1;background:transparent;border:0;padding:9px 2px;color:#75695a;display:grid;place-items:center;gap:5px;font-size:10px;font-weight:700}.bottom button svg{width:20px;height:20px}.bottom button[aria-current=page]{color:var(--wine)}.toast{position:fixed;z-index:9;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));max-width:540px;margin:auto;background:#28331b;color:white;padding:14px;border-radius:10px;box-shadow:0 10px 40px #0002;font-size:13px;display:none}.toast.show{display:block}.hidden{display:none!important}.loading{display:flex;gap:11px;justify-content:center;padding:60px 20px;color:var(--olive)}.spinner{height:21px;width:21px;border:2px solid #d5c7a8;border-top-color:#28331b;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:720px){.top{border-radius:0 0 17px 17px}.shell{padding-left:25px;padding-right:25px}.bottom{border-radius:17px 17px 0 0;width:720px;left:50%;transform:translateX(-50%);box-shadow:0 -5px 25px #0000000b}}
@media(max-width:340px){.role-grid{grid-template-columns:1fr}.headline{font-size:29px}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){.track>div{transition:none}.spinner{animation:none}}

:root{--olive:#21372e;--olive2:#365246;--cream:#f6f1e8;--paper:#fcf9f3;--line:#e1d7c7;--text:#272b25;--muted:#777468;--wine:#a1433e;--gold:#be9157;--shadow:none}
body{background-image:linear-gradient(90deg,#c8b59409 1px,transparent 1px);background-size:26px 26px}.top{background:#203c30;border-radius:0}.brand{letter-spacing:-.6px}.brand-icon{border:1px solid #c8ac77;border-radius:50%;color:#f0dbab;background:transparent}.back{border-radius:3px}.panel,.notice,.role-card,.btn,.auth-tabs,.auth-tabs button,.member,.field input,.field textarea,.code,.compact,.rating{border-radius:4px;box-shadow:none}.member{background:#254438;min-height:190px}.member:after{border-color:#c2a56c50}.member h2{font-size:34px}.member .status{color:#e6cfa6}.headline{font-size:clamp(33px,8vw,44px);letter-spacing:-1.2px}.panel h2{font-size:24px}.btn.primary{background:#a1433e;border-color:#a1433e}.btn.olive{background:#254438;border-color:#254438}.eyebrow{color:#986648;letter-spacing:2px}.role-card{background:#fdfbf5}.role-card[aria-pressed=true]{background:#ebeee4}.toast{border-radius:4px}.bottom{background:#fcf9f3}.bottom button[aria-current=page]{color:#315743}.notice{background:#eee9de}


.account-visual{height:135px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative;isolation:isolate;border:1px solid #d9c7ab;margin:0 0 22px;background:repeating-linear-gradient(130deg,transparent 0 26px,#f3dab313 27px 28px),#274537;border-radius:5px;box-shadow:0 8px 18px #15281e18;color:#eedab1}
